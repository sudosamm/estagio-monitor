# Coolify: crie um recurso "Docker Compose" apontando para este repositório.
# As variáveis abaixo aparecem sozinhas na aba "Environment Variables" do Coolify.
# Localmente: copie .env.example para .env e rode  docker compose up -d --build
services:
  estagio-monitor:
    build: .
    restart: unless-stopped
    ports:
      # porta do servidor (VPS) : porta dentro do container (não mude a da direita)
      - "${PORTA:-8000}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SENHA_PADRAO: ${SENHA_PADRAO:-estagio123}
      ACEITAR_SENHA_PADRAO: ${ACEITAR_SENHA_PADRAO:-0}
      ADMIN_NOME: ${ADMIN_NOME}
      NOME_SISTEMA: ${NOME_SISTEMA:-Estágio Monitor}
      NOME_INSTITUICAO: ${NOME_INSTITUICAO:-Secretaria da Educação do Ceará}
      TAMANHO_MAX_ANEXO_MB: ${TAMANHO_MAX_ANEXO_MB:-10}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # avisos por e-mail (opcional): sem EMAIL_HOST os avisos ficam só no sino
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      SITE_URL: ${SITE_URL:-}
      RESUMO_AUTOMATICO: ${RESUMO_AUTOMATICO:-1}
      VAPID_CONTATO: ${VAPID_CONTATO:-}
      PUSH_ATIVO: ${PUSH_ATIVO:-1}
      SUGESTOES_EMAIL: ${SUGESTOES_EMAIL:-}
      DEBUG: ${DEBUG:-0}
      FORCAR_HTTPS: ${FORCAR_HTTPS:-0}
      # banco: vazio = SQLite em /data. O PostgreSQL é um recurso próprio do Coolify (nunca neste arquivo)
      DATABASE_URL: ${DATABASE_URL:-}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      # backup do volume /data para o Cloudflare R2 (docs/operacao/backup.md)
      BACKUP_CHAVE: ${BACKUP_CHAVE:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_CHAVE_ID: ${BACKUP_S3_CHAVE_ID:-}
      BACKUP_S3_SEGREDO: ${BACKUP_S3_SEGREDO:-}
      BACKUP_S3_REGIAO: ${BACKUP_S3_REGIAO:-auto}
      BACKUP_PREFIXO: ${BACKUP_PREFIXO:-volume-dados}
    volumes:
      - estagio-dados:/data

volumes:
  estagio-dados:
