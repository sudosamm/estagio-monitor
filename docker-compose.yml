# Coolify: crie um recurso "Docker Compose" apontando para este repositório,
# ou rode localmente com:  docker compose up -d --build
services:
  estagio-monitor:
    build: .
    restart: unless-stopped
    ports:
      - "${PORTA:-8000}:8000"
    env_file:
      - .env
    volumes:
      - estagio-dados:/data

volumes:
  estagio-dados:
