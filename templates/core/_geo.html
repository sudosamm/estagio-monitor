{% load ui %}{% with ent=reg.local_entrada sai=reg.local_saida %}{% if ent or sai %}<span class="geo-linha">{% if ent %}<a class="geo{% if ent.longe %} longe{% elif ent.longe is False %} perto{% endif %}"{% if ent.mapa %} href="{{ ent.mapa }}" target="_blank" rel="noopener noreferrer"{% endif %} title="Localização na entrada">{% icone "pin" %} Entrada {{ ent.texto }}</a>{% endif %}{% if sai %}<a class="geo{% if sai.longe %} longe{% elif sai.longe is False %} perto{% endif %}"{% if sai.mapa %} href="{{ sai.mapa }}" target="_blank" rel="noopener noreferrer"{% endif %} title="Localização na saída">{% icone "pin" %} Saída {{ sai.texto }}</a>{% endif %}</span>{% endif %}{% endwith %}
